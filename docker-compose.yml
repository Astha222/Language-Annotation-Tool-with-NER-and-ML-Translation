services:
  postgres:
    image: postgres:16-alpine
    container_name: annotation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-annotationtool}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-annotationtool}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - annotation-net

  mongodb:
    image: mongo:7.0
    container_name: annotation_mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - annotation-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: annotation_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-annotationtool}
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: ${MONGO_DB:-annotationtool}
      JWT_SECRET: ${JWT_SECRET:-annotationtool_jwt_secret_dev_key_32chars_min!}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:8000,http://127.0.0.1:8000}
      HF_HOME: /root/.cache/huggingface
      PRELOAD_MODELS: ${PRELOAD_MODELS:-ner_en,ner_hi,mt:en-hi}
      NER_MAX_MODELS: ${NER_MAX_MODELS:-4}
      LOCAL_MT_MAX_LOADED: ${LOCAL_MT_MAX_LOADED:-6}
      TRANSLATION_PROVIDERS: ${TRANSLATION_PROVIDERS:-azure,local}
      LOCAL_INDICTRANS: ${LOCAL_INDICTRANS:-1}
      # Azure AI Translator (optional). backend/.env is NOT read inside the container (it holds Windows paths and is kept out of the image),
      # so put these in a .env file next to this docker-compose.yml (see .env.example; .env is git-ignored). Without a key, only the
      # offline models translate, and the first request for each language downloads its model (1-2 minutes).
      AZURE_TRANSLATOR_KEY: ${AZURE_TRANSLATOR_KEY:-}
      AZURE_TRANSLATOR_REGION: ${AZURE_TRANSLATOR_REGION:-}
      AZURE_TRANSLATOR_ENDPOINT: ${AZURE_TRANSLATOR_ENDPOINT:-}
      # Hugging Face READ token, only while the English model's repository is private (otherwise English uses the fallback model)
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - annotation-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000}
    container_name: annotation_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:8081"
    networks:
      - annotation-net

volumes:
  postgres_data:
    name: annotation_tool_postgres_data
  mongo_data:
    name: annotation_tool_mongo_data
  hf_cache:
    name: annotation_tool_hf_cache

networks:
  annotation-net:
    driver: bridge
